# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "T. Eric Ngo"
title_separator          : "-"
name                     : &name "Eric Ngo"
description              : &description "PhD candidate at the University of Iowa"
url                      : "https://t-ericngo.github.io" # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "t-ericngo/t-ericngo.github.io"
color_theme              : "earthy_n2"   # "earthy_n2", "earthy_n3" (warm paper, rust, navy section titles; n3 = lighter navy) or "classic" (white and teal); colors are in assets/css/custom.css


# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : "profile-photo-main.jpg"
  name             : "T. Eric Ngo"
  pronouns         : # example: "she/her"  
  # bio: <br> starts a new line; each <span> keeps an area on one line (wraps only at the dots)
  bio              : "PhD Candidate in <span>Political Science</span>,<br><span>University of Iowa</span><br><span>International relations</span>&nbsp;· <span>Foreign policy</span>&nbsp;· <span>Elite politics</span>&nbsp;· <span>Authoritarian politics</span>&nbsp;· <span>Computational social science</span>"
  location         : "Iowa City, IA, USA"
  employer         : "University of Iowa"
  uri              : # URL
  email            : "tu-ngo@uiowa.edu"
  pub_name         : "Anh-Tu Ngo"   # the name you publish under; it is bolded in author lists on the Research page

  # Academic websites
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=7d2nT7MAAAAJ"
  impactstory      : # URL
  orcid            : # "http://orcid.org/yourorcidurl"
  semantic         : # URL
  pubmed           : # "https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  researchgate     : # URL

  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "t-ericngo"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  twitter          : "ericngo11t"
  bluesky          : "t-ericngo.bsky.social" # Replace this with you Bluesky username
  facebook         : # Username
  goodreads        : # Username
  google_plus      : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : "tu-ducanh-ngo"
  mastodon         : # URL
  medium           : # URL
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username

  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # URL

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  hide                   : true      # no blog posts on this site, so the RSS feed link is hidden
  path                   : # blank (default) uses feed.xml


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "profile-photo-main.jpg" # image shown when the site is shared on social media
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               :  "false" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
  - README.md
  - CONTRIBUTING.md
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap.py
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# CV shown on the CV page. To update your CV, replace files/NgoEric_CV.pdf
# with the new PDF (same file name) and change cv_updated.
cv_pdf                   : "/files/NgoEric_CV.pdf"
cv_updated               : "October 2026"


# These settings control the types of collections used by the template
#   _research : one file per paper/project (front matter = details, body = abstract)
#   _talks    : one file per talk (body = abstract; or set `paper:` to reuse a paper's abstract)
#   _teaching : one file per course/workshop (body = the "Summary" text)
# Entries are shown only on the Research, Talks, and Teaching pages (output: false),
# so they have no separate pages of their own. Each entry has an anchor, e.g.
# /research/#us-versus-them opens that paper's abstract directly.
collections:
  research:
    output: false
  teaching:
    output: false
  talks:
    output: false


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      sitemap: false
      
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      
  # _teaching
  - scope:
      path: "_teaching"
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
      
  # _research
  - scope:
      path: "_research"
      type: "research"
    values:
      layout: single
      author_profile: true
      show_date: false
      
  # _publications
  # - scope:
  #     path: "_publications"
  #     type: publications
  #   values:
  #     layout: single
  #     author_profile: true
  #     share: true
  #     comments: true
      
  # _portfolio
  # - scope:
  #     path: ""
  #     type: portfolio
  #   values:
  #     layout: single
  #     author_profile: true
  #     share: true
  #     comment: true
  #     sitemap: false
      
  # _talks
  - scope:
      path: "_talks"
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/Chicago # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
